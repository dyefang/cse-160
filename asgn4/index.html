<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dylan Fang - Assignment 5 Lighting World</title>
  <style>
    body { margin: 0; background: #101820; color: white; font-family: Arial, sans-serif; overflow: hidden; }
    #webgl { display: block; margin: 0 auto; width: 100vw; height: 100vh; background: #87ceeb; }
    #hud {
      position: fixed; left: 14px; top: 12px; padding: 12px 14px;
      background: rgba(0,0,0,0.55); border-radius: 10px; line-height: 1.45;
      font-size: 14px; max-width: 460px;
    }
    #story { color: #ffeaa7; font-weight: bold; }
    button { margin: 3px 4px 3px 0; }
    label { display: block; margin-top: 5px; }
  </style>
</head>
<body onload="main()">
  <canvas id="webgl" width="1920" height="1080"></canvas>

  <div id="hud">
    <div><b>Koala Forest Rescue - Assignment 5 Lighting</b></div>
    <div id="fps">FPS: --</div>
    <div id="story">Collect 4 glowing leaf crystals, return to the Life Tree, and protect the Koala Grove.</div>
    <div>WASD move | Q/E turn | Click + drag mouse | Space/Shift fly</div>
    <div>F add block | R remove block | Shift+Click koala explode</div>

    <hr>
    <button onclick="toggleLighting()">Lighting On/Off</button>
    <button onclick="toggleNormals()">Normal Viz On/Off</button>
    <button onclick="togglePointLight()">Point Light On/Off</button>
    <button onclick="toggleSpotLight()">Spotlight On/Off</button>

    <label>Point Light X:
      <input id="lightXSlider" type="range" min="0" max="48" value="24" step="0.1" oninput="updateLightSlider()">
    </label>
    <label>Point Light Y:
      <input id="lightYSlider" type="range" min="1" max="18" value="7" step="0.1" oninput="updateLightSlider()">
    </label>
    <label>Point Light Z:
      <input id="lightZSlider" type="range" min="0" max="48" value="24" step="0.1" oninput="updateLightSlider()">
    </label>

    <label>Light Red:
      <input id="lightRSlider" type="range" min="0" max="1" value="1" step="0.01" oninput="updateLightSlider()">
    </label>
    <label>Light Green:
      <input id="lightGSlider" type="range" min="0" max="1" value="1" step="0.01" oninput="updateLightSlider()">
    </label>
    <label>Light Blue:
      <input id="lightBSlider" type="range" min="0" max="1" value="1" step="0.01" oninput="updateLightSlider()">
    </label>
  </div>

  <script src="lib/webgl-utils.js"></script>
  <script src="lib/webgl-debug.js"></script>
  <script src="lib/cuon-utils.js"></script>
  <script src="lib/cuon-matrix-cse160.js"></script>

  <script src="Camera.js"></script>
  <script src="Cube.js"></script>
  <script src="Cylinder.js"></script>
  <script src="Sphere.js"></script>
  <script src="ObjModel.js"></script>
  <script src="Koala.js"></script>
  <script src="asg4.js"></script>
</body>
</html>
